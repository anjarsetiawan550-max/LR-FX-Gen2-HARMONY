name: Build LR FX Gen 2 (Standalone + VST3)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, tag: Windows }
          - { name: macOS,   os: macos-latest,   tag: macOS }
          - { name: Linux,   os: ubuntu-22.04,   tag: Linux }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure (Windows / Linux)
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS universal)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          ART="build/ReverbFX_artefacts/Release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$ART/VST3"       && 7z a -tzip "$GITHUB_WORKSPACE/dist/LR-FX-Gen-2-VST3-${{ matrix.tag }}.zip" "LR FX Gen 2.vst3")
            (cd "$ART/Standalone" && 7z a -tzip "$GITHUB_WORKSPACE/dist/LR-FX-Gen-2-Standalone-${{ matrix.tag }}.zip" "LR FX Gen 2.exe")
          elif [ "$RUNNER_OS" = "macOS" ]; then
            (cd "$ART/VST3"       && zip -r -y "$GITHUB_WORKSPACE/dist/LR-FX-Gen-2-VST3-${{ matrix.tag }}.zip" "LR FX Gen 2.vst3")
            (cd "$ART/Standalone" && zip -r -y "$GITHUB_WORKSPACE/dist/LR-FX-Gen-2-Standalone-${{ matrix.tag }}.zip" "LR FX Gen 2.app")
          else
            (cd "$ART/VST3"       && zip -r -y "$GITHUB_WORKSPACE/dist/LR-FX-Gen-2-VST3-${{ matrix.tag }}.zip" "LR FX Gen 2.vst3")
            (cd "$ART/Standalone" && zip -r -y "$GITHUB_WORKSPACE/dist/LR-FX-Gen-2-Standalone-${{ matrix.tag }}.zip" "LR FX Gen 2")
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: LR-FX-Gen-2-${{ matrix.tag }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
